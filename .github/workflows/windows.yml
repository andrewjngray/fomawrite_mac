name: Windows

on:
  push:
    branches: [windows/port]
  pull_request:
  workflow_dispatch:
    inputs:
      theme_atomic_diagnostics:
        description: 'Run only the bounded ARM64 atomic-theme diagnostic (no full-suite qualification)'
        required: false
        type: boolean
        default: false
      menu_baseline_revision:
        description: 'Optional full commit SHA for native Focus/chrome/Go menu red/green proof'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.theme_atomic_diagnostics }}
    uses: ./.github/workflows/windows-theme-diagnostics.yml
  native:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.theme_atomic_diagnostics }}
    name: Native ${{ matrix.architecture }} / Qt 6.11.3 / MSVC2022 v143
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: windows-11-vs2026-arm
          - architecture: x64
            runner: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      QT_ROOT_DIR: C:/Qt/6.11.3-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch optional same-origin menu baseline
        id: menu-baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.menu_baseline_revision != '' }}
        env:
          MENU_BASELINE_REVISION: ${{ inputs.menu_baseline_revision }}
        run: |
          if ($env:MENU_BASELINE_REVISION -notmatch '^[0-9a-fA-F]{40}$') { throw 'menu_baseline_revision must be a full 40-character commit SHA.' }
          git fetch --no-tags --depth=1 origin $env:MENU_BASELINE_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the exact menu baseline from origin.' }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check deployment-evidence guards
        run: |
          python windows/test_ci.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python windows/test_normal_launch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest windows.test_live_edit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest windows.test_desktop_supplement
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest windows.test_install_qt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File windows/test_launch_local.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File windows/test_normal_launch_wait.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File windows/test_uia_retry.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File windows/test_menu_click_bounds.ps1 -HelperPath bin/windows/normal-launch-input.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse and compile desktop supplement without desktop input
        run: |
          powershell.exe -NoProfile -File windows/test_desktop_supplement_prepare.ps1 -Output build/desktop-supplement-preparation.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain desktop supplement preparation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-supplement-preparation-${{ matrix.architecture }}-${{ github.sha }}
          path: build/desktop-supplement-preparation.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Install pinned Qt SDK and WebEngine/PDF extensions
        run: |
          python bin/windows/install-qt.py --architecture ${{ matrix.architecture }} --output "$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "build/windows-${{ matrix.architecture }}" | Out-Null
          Copy-Item "$env:QT_ROOT_DIR/fomawrite-qt-install.json" "build/windows-${{ matrix.architecture }}/qt-install.json"

      - name: Build app (native MSVC2022 toolset)
        id: build
        run: ./bin/windows/build.ps1 -Architecture ${{ matrix.architecture }}

      - name: Deploy portable application and bind manifest
        id: package
        run: ./bin/windows/package.ps1 -Architecture ${{ matrix.architecture }}

      - name: Upload internal diagnostic ZIP and SHA-256 (qualification remains in evidence)
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Fomawrite-internal-diagnostic-windows-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            dist/windows-${{ matrix.architecture }}/*.zip
            dist/windows-${{ matrix.architecture }}/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Build and run complete Qt regression suite
        id: qt-tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./bin/windows/test.ps1 -Architecture ${{ matrix.architecture }}

      - name: Prove native Focus, chrome and Go menu regressions
        if: ${{ !cancelled() && steps.qt-tests.outcome == 'success' && steps.menu-baseline.outcome == 'success' }}
        env:
          MENU_BASELINE_REVISION: ${{ inputs.menu_baseline_revision }}
        run: ./bin/windows/prove-menu-regressions.ps1 -Architecture ${{ matrix.architecture }} -BaselineRevision $env:MENU_BASELINE_REVISION

      - name: Exercise deployed executable on native Windows desktop
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: python bin/windows/check-document-views.py --package "dist/windows-${{ matrix.architecture }}/Fomawrite" --output "build-tests/windows-${{ matrix.architecture }}/deployed-acceptance"

      - name: Upload test/deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-evidence-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            build-tests/windows-${{ matrix.architecture }}/test.log
            build-tests/windows-${{ matrix.architecture }}/test.xml
            build-tests/windows-${{ matrix.architecture }}/native-appearance.log
            build-tests/windows-${{ matrix.architecture }}/native-appearance.xml
            build-tests/windows-${{ matrix.architecture }}/menu-regression-proof/
            build-tests/windows-${{ matrix.architecture }}/deployed-acceptance/
            dist/windows-${{ matrix.architecture }}/Fomawrite/manifest.json
            build/windows-${{ matrix.architecture }}/qt-install.json
          if-no-files-found: ignore
          retention-days: 14
